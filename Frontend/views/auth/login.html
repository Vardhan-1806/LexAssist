<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – LEXASSIST</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
  <style>
    .otp-wrap  { display:flex; gap:clamp(5px,2.2vw,10px); justify-content:center; margin:18px 0 12px; }
    .otp-wrap input { width:clamp(38px,11vw,50px); height:56px; flex:0 1 50px; text-align:center; font-size:1.45rem; font-weight:900; border:1.5px solid #d8dee8; border-radius:14px; outline:none; color:var(--navy); background:#fbfcfe; transition:border-color .2s,box-shadow .2s,transform .22s cubic-bezier(.2,.8,.2,1),background .2s; font-family:'DM Sans',sans-serif; animation:login-digit-in .4s both; }
    .otp-wrap input:nth-child(2){animation-delay:.04s}.otp-wrap input:nth-child(3){animation-delay:.08s}.otp-wrap input:nth-child(4){animation-delay:.12s}.otp-wrap input:nth-child(5){animation-delay:.16s}.otp-wrap input:nth-child(6){animation-delay:.2s}
    .otp-wrap input:focus { border-color:var(--gold); box-shadow:0 0 0 4px rgba(201,168,76,0.17); transform:translateY(-3px); }
    .otp-wrap input.filled { border-color:#c99f46; background:#fffaf0; animation:login-digit-pop .28s cubic-bezier(.2,.9,.3,1.3); }
    .login-otp-hint{margin:0 0 16px;text-align:center;color:var(--muted);font-size:.76rem;line-height:1.5}.login-otp-tools{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:.75rem}.login-otp-tools button{border:0;background:transparent;color:#a3761f;font:inherit;font-weight:700;cursor:pointer}.login-otp-tools button:disabled{color:#9299a5;cursor:default}.otp-wrap.shake{animation:login-otp-shake .36s ease}
    .auth-step-back{display:block;border:0;background:transparent;color:#78818e;font-size:.8rem;cursor:pointer;padding:4px 0 8px}.auth-step-back:hover{color:#9a6c10}
    @keyframes login-digit-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@keyframes login-digit-pop{50%{transform:scale(1.12)}}@keyframes login-otp-shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
    .eye-btn { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1rem; padding:4px; }
  </style>
  <link rel="stylesheet" href="/css/premium.css">
</head>
<body class="auth-body">

  <!-- ── STEP 1: Login Form ── -->
  <div class="auth-box" id="loginBox">
    <div class="auth-logo"><span class="auth-brand-name">Lex<span>Assist</span></span></div>
    <h2 class="auth-title" style="margin-top:12px">Welcome Back</h2>
    <p class="auth-subtitle">Sign in to access your dashboard</p>

    <div id="msg" class="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative">
          <input type="password" id="password" class="form-control" placeholder="Your password" autocomplete="current-password" style="padding-right:44px">
          <button type="button" class="eye-btn" onclick="toggleEye()">👁️</button>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:8px">
        <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:0.855rem;color:var(--muted)">
          <input type="checkbox" id="rememberMe" style="width:16px;height:16px;accent-color:var(--gold)">
          Remember email for 24 hours
        </label>
        <a href="/forgot-password" style="font-size:0.82rem;color:var(--gold);font-weight:600;text-decoration:none">Forgot password?</a>
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-full btn-lg">Sign In →</button>
    </form>


    <div class="auth-footer">Don't have an account? <a href="/register">Register here</a></div>
  </div>

  <!-- ── STEP 2: OTP verification (if email not yet verified) ── -->
  <div class="auth-box" id="otpBox" style="display:none">
    <button type="button" class="auth-step-back" onclick="backToLogin()" aria-label="Back to sign in"><span aria-hidden="true">←</span> Back to sign in</button>
    <div class="auth-logo"><span class="auth-brand-name">Lex<span>Assist</span></span></div>
    <div style="text-align:center;margin:18px 0">
      <div class="login-otp-emblem" aria-hidden="true">✉</div>
      <h2 class="auth-title">Verify Your Email</h2>
      <p class="auth-subtitle">Enter the 6-digit code sent to<br><strong id="otpEmail" style="color:var(--navy)"></strong></p>
    </div>

    <div id="otpMsg" class="alert"></div>

    <div class="otp-wrap">
      <input type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code" aria-label="Verification code digit 1" id="oo0" onpaste="pasteLoginOTP(event)" oninput="omv(this,0)" onkeydown="obk(event,0)">
      <input type="text" maxlength="1" inputmode="numeric" aria-label="Verification code digit 2" id="oo1" onpaste="pasteLoginOTP(event)" oninput="omv(this,1)" onkeydown="obk(event,1)">
      <input type="text" maxlength="1" inputmode="numeric" aria-label="Verification code digit 3" id="oo2" onpaste="pasteLoginOTP(event)" oninput="omv(this,2)" onkeydown="obk(event,2)">
      <input type="text" maxlength="1" inputmode="numeric" aria-label="Verification code digit 4" id="oo3" onpaste="pasteLoginOTP(event)" oninput="omv(this,3)" onkeydown="obk(event,3)">
      <input type="text" maxlength="1" inputmode="numeric" aria-label="Verification code digit 5" id="oo4" onpaste="pasteLoginOTP(event)" oninput="omv(this,4)" onkeydown="obk(event,4)">
      <input type="text" maxlength="1" inputmode="numeric" aria-label="Verification code digit 6" id="oo5" onpaste="pasteLoginOTP(event)" oninput="omv(this,5)" onkeydown="obk(event,5)">
    </div>
    <p class="login-otp-hint">Check your inbox and spam folder. You can paste the full 6-digit code here.</p>

    <button onclick="verifyLoginOTP()" id="otpBtn" class="btn btn-primary btn-full btn-lg">Verify & Login →</button>

    <div style="display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap">
      <div class="login-otp-tools"><button onclick="resendLoginOTP()" id="otpResendBtn">Resend code</button><span id="otpResendTimer"></span></div>
    </div>
  </div>

  <script>
    let pendingEmail = '', resendCooldown = null;

    // Auto-fill remembered email
    (function() {
      const saved = localStorage.getItem('lex_rem_email');
      if (saved) {
        document.getElementById('email').value = saved;
        document.getElementById('rememberMe').checked = true;
      }
      // Show success message if redirected from verify
      const p = new URLSearchParams(window.location.search);
      if (p.get('verified') === 'true') showMsg('✅ Email verified! You can now login.','success');
      if (p.get('reset')    === 'true') showMsg('✅ Password reset! Please login.','success');
    })();

    function toggleEye() {
      const i = document.getElementById('password');
      const b = i.nextElementSibling;
      i.type  = i.type==='password'?'text':'password';
      b.textContent = i.type==='password'?'👁️':'🙈';
    }

    function showMsg(txt, type='danger', id='msg') {
      const el = document.getElementById(id);
      el.className = `alert alert-${type} show`;
      el.textContent = txt;
      el.scrollIntoView({behavior:'smooth',block:'nearest'});
    }

    function fillDemo(email, pass) {
      document.getElementById('email').value    = email;
      document.getElementById('password').value = pass;
      doLogin();
    }

    // ── Main login ────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      doLogin();
    });

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('password').value;
      if (!email || !pass) { showMsg('Please enter email and password'); return; }

      const btn = document.getElementById('loginBtn');
      btn.innerHTML = '<span class="loader"></span> Signing in...';
      btn.disabled  = true;

      try {
        const r = await fetch('/api/auth/login', {
          method:  'POST',
          headers: {'Content-Type':'application/json'},
          body:    JSON.stringify({ email, password:pass, rememberMe: document.getElementById('rememberMe').checked })
        });
        const d = await r.json();

        if (!d.success) {
          if (d.pendingVerification) {
            showMsg(`⏳ Your lawyer profile is pending admin verification.\n\nYou will receive an email at ${email} once your Bar Council ID and credentials are approved.\n\nThis usually takes 24-48 hours.`, 'warning');
          } else if (d.rejected) {
            showMsg(`❌ Profile Not Approved\n${d.message}`, 'danger');
          } else if (d.requiresOTP) {
            // Show OTP box
            pendingEmail = d.email || email;
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('otpBox').style.display   = 'block';
            document.getElementById('otpEmail').textContent   = pendingEmail;
            document.querySelector('.otp-wrap').classList.add('is-ready');
            document.getElementById('oo0').focus();
            showMsg(d.devOTP
              ? `Preview code: ${d.devOTP} — enter it below.`
              : `A verification code has been sent to ${pendingEmail}. Check your inbox and spam folder.`,
              'info', 'otpMsg');
          } else {
            showMsg(d.message || 'Invalid email or password');
          }
          btn.innerHTML = 'Sign In →';
          btn.disabled  = false;
          return;
        }

        // Handle remember me
        if (document.getElementById('rememberMe').checked) {
          localStorage.setItem('lex_rem_email', email);
        } else {
          localStorage.removeItem('lex_rem_email');
        }

        handleLoginSuccess(d);

      } catch(err) {
        showMsg('Connection error. Please check your internet connection.');
        btn.innerHTML = 'Sign In →';
        btn.disabled  = false;
      }
    }

    function handleLoginSuccess(d) {
      localStorage.setItem('user',  JSON.stringify(d.data));
      showMsg('✅ Login successful! Redirecting...','success');
      const role = d.data?.role || 'citizen';
      setTimeout(() => {
        window.location.href = role==='admin' ? '/dashboard/admin' :
                               role==='lawyer'? '/dashboard/lawyer' : '/dashboard/citizen';
      }, 600);
    }

    // ── OTP helpers ───────────────────────────────────────────
    function omv(el, idx) {
      el.value = el.value.replace(/\D/g,'').slice(-1);
      el.classList.toggle('filled', el.value!=='');
      if (el.value && idx < 5) document.getElementById('oo'+(idx+1)).focus();
      if (idx===5 && el.value) document.getElementById('otpBtn').focus();
    }
    function obk(e,idx) {
      if (e.key==='Backspace' && !e.target.value && idx>0){const prev=document.getElementById('oo'+(idx-1));prev.focus();prev.value='';prev.classList.remove('filled');}
      if(e.key==='ArrowLeft'&&idx>0)document.getElementById('oo'+(idx-1)).focus();
      if(e.key==='ArrowRight'&&idx<5)document.getElementById('oo'+(idx+1)).focus();
    }
    function pasteLoginOTP(e) {
      const digits = (e.clipboardData.getData('text') || '').replace(/\D/g,'').slice(0,6);
      if (!digits) return;
      e.preventDefault();
      [0,1,2,3,4,5].forEach(index=>{const input=document.getElementById('oo'+index);input.value=digits[index]||'';input.classList.toggle('filled',!!input.value)});
      document.getElementById('oo'+Math.min(digits.length,5)).focus();
    }

    async function verifyLoginOTP() {
      const otp = [0,1,2,3,4,5].map(i=>document.getElementById('oo'+i).value).join('');
      if (otp.length!==6) { const wrap=document.querySelector('.otp-wrap');wrap.classList.remove('shake');void wrap.offsetWidth;wrap.classList.add('shake');showMsg('Enter all 6 digits','warning','otpMsg'); return; }

      const btn = document.getElementById('otpBtn');
      btn.innerHTML='<span class="loader"></span> Verifying...'; btn.disabled=true;

      try {
        const r = await fetch('/api/auth/verify-otp',{
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email:pendingEmail, otp })
        });
        const d = await r.json();

        if (!d.success) {
          showMsg(d.message,'danger','otpMsg');
          btn.innerHTML='Verify & Login →'; btn.disabled=false;
          return;
        }
        handleLoginSuccess(d);
      } catch(e) {
        showMsg('Server error. Please try again.','danger','otpMsg');
        btn.innerHTML='Verify & Login →'; btn.disabled=false;
      }
    }

    function startResendCooldown(seconds=30){const btn=document.getElementById('otpResendBtn'),timer=document.getElementById('otpResendTimer');clearInterval(resendCooldown);let left=seconds;btn.disabled=true;timer.textContent=`Try again in ${left}s`;resendCooldown=setInterval(()=>{left--;timer.textContent=left?`Try again in ${left}s`:'';if(left<=0){clearInterval(resendCooldown);btn.disabled=false}},1000)}
    async function resendLoginOTP() {
      const resendBtn=document.getElementById('otpResendBtn');resendBtn.disabled=true;resendBtn.textContent='Sending…';
      try {
        const r = await fetch('/api/auth/resend-otp',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({email:pendingEmail})
        });
        const d = await r.json();
        if(!r.ok||!d.success){showMsg(d.message||'Could not send a new code.','danger','otpMsg');resendBtn.textContent='Resend code';resendBtn.disabled=false;return}
        showMsg(d.devOTP?`Preview code: ${d.devOTP} — enter it below.`:'New code sent. Check inbox and spam folder.','success','otpMsg');
        [0,1,2,3,4,5].forEach(i=>{const el=document.getElementById('oo'+i);el.value='';el.classList.remove('filled');});
        document.getElementById('oo0').focus();resendBtn.textContent='Resend code';startResendCooldown();
      } catch(e) { showMsg('Could not reach email service. Please try again.','danger','otpMsg');resendBtn.textContent='Resend code';resendBtn.disabled=false; }
    }

    function backToLogin() {
      document.getElementById('otpBox').style.display   = 'none';
      document.getElementById('loginBox').style.display = 'block';
    }
  </script>
</body>
</html>
