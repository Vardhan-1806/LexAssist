<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – LEXASSIST</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/premium.css">
  <meta name="theme-color" content="#0d1b35">
</head>
<body class="auth-body reset-page">
  <!-- Step 1: Enter email -->
  <div class="auth-box" id="emailBox">
    <div class="auth-logo"><span class="auth-brand-name">Lex<span>Assist</span></span></div>
    <div style="text-align:center;margin:16px 0">
      <div class="reset-emblem" aria-hidden="true"><span>✦</span><i></i></div>
      <h2 class="auth-title">Forgot Password?</h2>
      <p class="auth-subtitle">Enter your registered email and we’ll send a secure reset code.</p>
    </div>
    <div id="msg1" class="alert"></div>
    <form id="emailForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="fpEmail" class="form-control" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <button type="submit" id="sendBtn" class="btn btn-primary btn-full btn-lg">Send OTP →</button>
    </form>
    <div class="auth-footer"><a href="/login">← Back to Login</a></div>
  </div>

  <!-- Step 2: OTP + New Password -->
  <div class="auth-box" id="resetBox" style="display:none">
    <div class="auth-logo"><span class="auth-brand-name">Lex<span>Assist</span></span></div>
    <button class="step-back" type="button" id="backToEmail" aria-label="Back to email entry">← Change email</button>
    <div class="reset-heading">
      <div class="mail-orbit" aria-hidden="true"><span>✉</span><i></i><b></b></div>
      <h2 class="auth-title">Enter OTP & New Password</h2>
      <p class="auth-subtitle" id="resetSubtitle"></p>
    </div>
    <div class="delivery-note" id="deliveryNote" role="status">Check your inbox and spam folder. The code expires in 10 minutes.</div>
    <div id="msg2" class="alert"></div>
    <form id="resetForm">
      <div class="form-group">
        <label class="form-label">6-Digit OTP</label>
        <div class="otp-digits" id="otpDigits" aria-label="6 digit verification code">
          <input type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code" class="otp-d" aria-label="Verification code digit 1" onpaste="pasteResetOTP(event)" oninput="mv(this,0)" onkeydown="bk(event,0)">
          <input type="text" maxlength="1" class="otp-d" aria-label="Verification code digit 2" onpaste="pasteResetOTP(event)" oninput="mv(this,1)" onkeydown="bk(event,1)">
          <input type="text" maxlength="1" class="otp-d" aria-label="Verification code digit 3" onpaste="pasteResetOTP(event)" oninput="mv(this,2)" onkeydown="bk(event,2)">
          <input type="text" maxlength="1" class="otp-d" aria-label="Verification code digit 4" onpaste="pasteResetOTP(event)" oninput="mv(this,3)" onkeydown="bk(event,3)">
          <input type="text" maxlength="1" class="otp-d" aria-label="Verification code digit 5" onpaste="pasteResetOTP(event)" oninput="mv(this,4)" onkeydown="bk(event,4)">
          <input type="text" maxlength="1" class="otp-d" aria-label="Verification code digit 6" onpaste="pasteResetOTP(event)" oninput="mv(this,5)" onkeydown="bk(event,5)">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div style="position:relative">
          <input type="password" id="newPwd" class="form-control" placeholder="Min 8 chars with Aa1!" style="padding-right:44px">
          <button type="button" onclick="const i=document.getElementById('newPwd');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁️':'🙈'" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer">👁️</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" id="confPwd" class="form-control" placeholder="Re-enter new password">
      </div>
      <button type="submit" id="resetBtn" class="btn btn-primary btn-full btn-lg">Reset Password <span aria-hidden="true">→</span></button>
    </form>
    <div class="otp-actions"><span id="otpTimer">Code expires in 10:00</span><button type="button" id="resendBtn" disabled>Resend code <span id="resendTimer">30s</span></button></div>
    <div class="reset-success" id="resetSuccess" aria-live="polite"><span class="success-check">✓</span><strong>Password updated</strong><span>Taking you to your workspace…</span></div>
  </div>

  <style>
    .reset-page{background:radial-gradient(ellipse at 14% 12%,rgba(201,168,76,.2),transparent 34%),radial-gradient(ellipse at 88% 84%,rgba(73,112,173,.32),transparent 38%),linear-gradient(135deg,#09152d,#14284b 58%,#0d1b35);position:relative;overflow-x:hidden}
    .reset-page::before,.reset-page::after{content:"";position:fixed;border:1px solid rgba(234,205,129,.13);border-radius:50%;pointer-events:none;animation:reset-drift 12s ease-in-out infinite alternate}
    .reset-page::before{width:360px;height:360px;top:-190px;right:-100px}.reset-page::after{width:260px;height:260px;bottom:-150px;left:-90px;animation-delay:-4s}
    .reset-page .auth-box{position:relative;z-index:1;border:1px solid rgba(201,168,76,.28);box-shadow:0 28px 90px rgba(0,0,0,.34);animation:reset-card-in .55s cubic-bezier(.2,.8,.2,1) both}.step-out{animation:reset-card-out .18s ease forwards}.step-in{animation:reset-card-in .4s cubic-bezier(.2,.8,.2,1) both}
    #resetBox{overflow:hidden}.auth-logo{text-align:center;margin-bottom:10px}.reset-emblem{width:58px;height:58px;margin:0 auto 12px;display:grid;place-items:center;position:relative;color:#bd8d2e;font-size:2.1rem;animation:emblem-float 3s ease-in-out infinite}.reset-emblem::before,.reset-emblem::after{content:"";position:absolute;inset:4px;border:1px solid rgba(189,141,46,.36);border-radius:50%;animation:emblem-ring 2.8s ease-out infinite}.reset-emblem::after{animation-delay:1.4s}.reset-emblem i{position:absolute;width:7px;height:7px;right:2px;top:11px;background:#e1bc65;border-radius:50%;box-shadow:0 0 14px #e1bc65}
    .reset-heading{text-align:center;margin:10px 0 8px}.reset-heading .auth-subtitle{margin-bottom:14px;overflow-wrap:anywhere}.mail-orbit{height:62px;width:70px;margin:0 auto 8px;position:relative;display:grid;place-items:center;color:#bd8d2e}.mail-orbit span{font-size:2rem;animation:mail-pop .6s cubic-bezier(.16,1,.3,1) both}.mail-orbit i,.mail-orbit b{position:absolute;width:7px;height:7px;border-radius:50%;background:#d8ad50;animation:mail-orbit 3s linear infinite}.mail-orbit b{animation-delay:-1.5s}.delivery-note{font-size:.76rem;line-height:1.45;color:#6a7281;text-align:center;background:#f8f5ef;border-radius:10px;padding:9px 12px;margin:0 0 18px}
    .otp-digits{display:flex;gap:clamp(5px,2vw,9px);justify-content:center;margin:10px 0 22px}.otp-d{width:clamp(38px,11vw,48px);height:54px;flex:0 1 48px;text-align:center;font-size:1.4rem;font-weight:800;border:1.5px solid #dce0e6;border-radius:13px;outline:none;color:#102342;background:#fbfcfe;transition:border-color .2s,box-shadow .2s,transform .22s cubic-bezier(.2,.8,.2,1),background .2s;animation:digit-in .4s both}.otp-d:nth-child(2){animation-delay:.04s}.otp-d:nth-child(3){animation-delay:.08s}.otp-d:nth-child(4){animation-delay:.12s}.otp-d:nth-child(5){animation-delay:.16s}.otp-d:nth-child(6){animation-delay:.2s}.otp-d:focus{border-color:#bd8d2e;box-shadow:0 0 0 4px rgba(201,168,76,.17);transform:translateY(-3px)}.otp-d.filled{background:#fffaf0;border-color:#c99f46;animation:digit-pop .28s cubic-bezier(.2,.9,.3,1.3)}.otp-digits.shake{animation:otp-shake .36s ease}
    .step-back{border:0;background:transparent;color:#777f8d;font-size:.78rem;cursor:pointer;padding:4px 0 10px;transition:color .2s}.step-back:hover,.otp-actions button:not(:disabled):hover{color:#9a6c10}.otp-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:15px;color:#7b8390;font-size:.73rem}.otp-actions button{border:0;background:none;color:#a3761f;font:inherit;font-weight:700;cursor:pointer}.otp-actions button:disabled{color:#9da3ad;cursor:default}.reset-success{display:none;position:absolute;inset:0;background:#fff;z-index:4;align-items:center;justify-content:center;flex-direction:column;gap:9px;color:#102342;animation:success-cover .35s ease both}.reset-success.show{display:flex}.success-check{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;background:#edf7ef;color:#27834a;font-size:2rem;animation:check-pop .5s cubic-bezier(.15,1.5,.4,1) both}.reset-success span:last-child{font-size:.84rem;color:#727b88}
    @keyframes reset-card-in{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}@keyframes reset-card-out{to{opacity:0;transform:translateY(-8px) scale(.99)}}@keyframes reset-drift{to{transform:translate(22px,-18px) rotate(8deg)}}@keyframes emblem-float{50%{transform:translateY(-4px)}}@keyframes emblem-ring{0%{transform:scale(.72);opacity:.7}100%{transform:scale(1.35);opacity:0}}@keyframes mail-orbit{to{transform:rotate(360deg) translateX(29px) rotate(-360deg)}}@keyframes mail-pop{from{opacity:0;transform:translateY(9px) scale(.7)}to{opacity:1;transform:none}}@keyframes digit-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@keyframes digit-pop{50%{transform:scale(1.12)}}@keyframes otp-shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes success-cover{from{opacity:0}to{opacity:1}}@keyframes check-pop{from{transform:scale(.4)}to{transform:scale(1)}}
    @media(max-width:420px){.reset-page{padding:14px}.reset-page .auth-box{padding:26px 18px}.otp-d{height:49px;border-radius:11px}.otp-actions{font-size:.68rem}}
    @media(prefers-reduced-motion:reduce){.reset-page::before,.reset-page::after,.reset-emblem,.reset-emblem::before,.reset-emblem::after,.mail-orbit span,.mail-orbit i,.mail-orbit b,.reset-page .auth-box,.otp-d,.success-check{animation:none!important;transition:none!important}}
  </style>

  <script>
    let resetEmail='',expiryInterval=null,resendInterval=null,resendIn=30,expiresIn=600;
    const otpInputs=()=>[...document.querySelectorAll('.otp-d')];
    function mv(el,i){el.value=el.value.replace(/[^0-9]/g,'').slice(-1);el.classList.toggle('filled',!!el.value);if(el.value&&i<5)otpInputs()[i+1].focus();if(i===5&&el.value)document.getElementById('newPwd').focus();}
    function bk(e,i){if(e.key==='Backspace'&&!e.target.value&&i>0){const prev=otpInputs()[i-1];prev.focus();prev.value='';prev.classList.remove('filled');}if(e.key==='ArrowLeft'&&i>0)otpInputs()[i-1].focus();if(e.key==='ArrowRight'&&i<5)otpInputs()[i+1].focus();}
    function pasteResetOTP(e){const digits=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!digits)return;e.preventDefault();otpInputs().forEach((input,index)=>{input.value=digits[index]||'';input.classList.toggle('filled',!!input.value)});otpInputs()[Math.min(digits.length,5)].focus();}
    const sm=(txt,type='danger',el='msg1')=>{const e=document.getElementById(el);e.className=`alert alert-${type} show`;e.textContent=txt;};
    function clearClocks(){clearInterval(expiryInterval);clearInterval(resendInterval)}
    function startClocks(){clearClocks();expiresIn=600;resendIn=30;document.getElementById('resendBtn').disabled=true;expiryInterval=setInterval(()=>{expiresIn=Math.max(0,expiresIn-1);document.getElementById('otpTimer').textContent=expiresIn?`Code expires in ${String(Math.floor(expiresIn/60)).padStart(2,'0')}:${String(expiresIn%60).padStart(2,'0')}`:'Code expired — request a new one';if(!expiresIn)clearInterval(expiryInterval)},1000);resendInterval=setInterval(()=>{resendIn=Math.max(0,resendIn-1);document.getElementById('resendTimer').textContent=resendIn?`${resendIn}s`:'';if(!resendIn){document.getElementById('resendBtn').disabled=false;clearInterval(resendInterval)}},1000)}
    async function requestResetCode(isResend=false){const btn=document.getElementById('sendBtn');btn.disabled=true;btn.innerHTML='<span class="loader"></span> Sending securely…';try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('fpEmail').value.trim()||resetEmail})});const d=await r.json();if(!r.ok||!d.success){sm(d.message||'Email delivery is temporarily unavailable. Please try again.', 'danger',isResend?'msg2':'msg1');return false}resetEmail=document.getElementById('fpEmail').value.trim()||resetEmail;if(isResend){if(d.devOTP)document.getElementById('deliveryNote').textContent=`Development preview code: ${d.devOTP} · Expires in 10 minutes`;return true}document.getElementById('emailBox').classList.add('step-out');setTimeout(()=>{document.getElementById('emailBox').style.display='none';document.getElementById('resetBox').style.display='block';document.getElementById('resetBox').classList.add('step-in');document.getElementById('resetSubtitle').textContent=`Enter the code sent to ${resetEmail}`;if(d.devOTP)document.getElementById('deliveryNote').textContent=`Development preview code: ${d.devOTP} · Expires in 10 minutes`;otpInputs()[0].focus();startClocks()},180);return true}catch(err){sm('Could not reach the server. Check your connection and retry.','danger',isResend?'msg2':'msg1');return false}finally{btn.innerHTML='Send OTP →';btn.disabled=false}}

    document.getElementById('emailForm').addEventListener('submit',e=>{e.preventDefault();requestResetCode()});
    document.getElementById('backToEmail').addEventListener('click',()=>{clearClocks();document.getElementById('resetBox').style.display='none';document.getElementById('resetBox').classList.remove('step-in');document.getElementById('emailBox').style.display='block';document.getElementById('emailBox').classList.remove('step-out');document.getElementById('fpEmail').focus()});
    document.getElementById('resendBtn').addEventListener('click',async()=>{const b=document.getElementById('resendBtn');b.disabled=true;b.textContent='Sending…';const ok=await requestResetCode(true);if(ok){otpInputs().forEach(i=>{i.value='';i.classList.remove('filled')});otpInputs()[0].focus();document.getElementById('deliveryNote').textContent='A fresh code was requested. Check your inbox and spam folder.';startClocks()}else{b.disabled=false;b.innerHTML='Resend code <span id="resendTimer"></span>'}});

    document.getElementById('resetForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const otp=[...document.querySelectorAll('.otp-d')].map(i=>i.value).join('');
      if(otp.length!==6){document.getElementById('otpDigits').classList.remove('shake');void document.getElementById('otpDigits').offsetWidth;document.getElementById('otpDigits').classList.add('shake');sm('Enter all 6 OTP digits','warning','msg2');return;}
      const np=document.getElementById('newPwd').value;
      if(np!==document.getElementById('confPwd').value){sm('Passwords do not match','danger','msg2');return;}
      const btn=document.getElementById('resetBtn'); btn.innerHTML='<span class="loader"></span> Updating…'; btn.disabled=true;
      try{const r=await fetch('/api/auth/reset-password',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:resetEmail,otp,newPassword:np})});const d=await r.json();if(d.success){clearClocks();localStorage.setItem('user',JSON.stringify(d.data));document.getElementById('resetSuccess').classList.add('show');setTimeout(()=>window.location.href='/dashboard/'+d.data.role,1400)}else{if(/otp/i.test(d.message||'')){document.getElementById('otpDigits').classList.remove('shake');void document.getElementById('otpDigits').offsetWidth;document.getElementById('otpDigits').classList.add('shake')}sm(d.errors?d.errors.join(' · '):d.message,'danger','msg2')}}catch(err){sm('Could not reach the server. Please retry.','danger','msg2')}finally{btn.innerHTML='Reset Password <span aria-hidden="true">→</span>';btn.disabled=false}
    });
  </script>
  <script src="/js/global-enhancements.js"></script>
</body>
</html>
